name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Type check
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Tests
        run: bunx vitest run

      - name: Server engine mirror is in sync
        run: bash scripts/sync-game-engine.sh --check
