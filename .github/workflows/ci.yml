name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Type check
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Tests
        run: bunx vitest run

      - name: Server engine mirror is in sync
        run: bash scripts/sync-game-engine.sh --check

      - name: Engine mirror sync produces no diff (consumer stamps committed)
        # Runs the full sync (writes mirror + stamps every _shared/game
        # consumer with the current engine-mirror-hash marker). If anything
        # changes, the markers / mirror weren't committed — fail the build so
        # we can't merge an engine change that would silently leave an edge
        # function running stale code (Lovable auto-deploy only fires when
        # files inside the function's own directory change).
        run: |
          bash scripts/sync-game-engine.sh
          if [ -n "$(git status --porcelain supabase/functions)" ]; then
            echo "::error::sync-game-engine.sh produced uncommitted changes:" >&2
            git status --porcelain supabase/functions >&2
            git --no-pager diff supabase/functions >&2
            exit 1
          fi
