<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lotus Mockup</title>
<style>
  html, body { margin:0; padding:0; background:transparent; }
  body { display:grid; place-items:center; min-height:100vh; font-family: system-ui, sans-serif; }

  /* tweak these to match the reference */
  :root {
    --size: 720px;            /* overall lotus diameter */
    --circle: 320px;          /* inner gold circle diameter */
    --petal-w: 170px;         /* petal width  */
    --petal-h: 230px;         /* petal height */
    --petal-offset: 130px;    /* distance from centre to petal CENTRE (tune so base sits on circle) */
    --gold: #c8902a;
  }

  .stage { width: var(--size); height: var(--size); position: relative; }

  /* central gold circle */
  .circle {
    position:absolute; left:50%; top:50%;
    width: var(--circle); height: var(--circle);
    margin-left: calc(var(--circle) / -2);
    margin-top:  calc(var(--circle) / -2);
    border: 3px solid var(--gold);
    border-radius: 50%;
    background: transparent;
    z-index: 2;
  }

  /* petals: base at centre, apex pointing outward (up before rotation) */
  .petal {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--petal-w);
    height: var(--petal-h);
    margin-left: calc(var(--petal-w) / -2);
    margin-top:  calc(var(--petal-h) / -2);
    transform-origin: 50% 50%;
    /* rotate around centre, then push outward along the rotated axis */
    transform: rotate(var(--a)) translateY(calc(var(--petal-offset) * -1));
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .petal img { width:100%; height:100%; display:block; }

  .p1 { --a:   0deg; }
  .p2 { --a:  45deg; }
  .p3 { --a:  90deg; }
  .p4 { --a: 135deg; }
  .p5 { --a: 180deg; }
  .p6 { --a: 225deg; }
  .p7 { --a: 270deg; }
  .p8 { --a: 315deg; }

  .controls {
    position: fixed; top: 12px; left: 12px;
    background: #fff; border:1px solid #ddd; border-radius:8px;
    padding:10px 12px; font-size:12px; line-height:1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .controls label { display:flex; align-items:center; gap:8px; }
  .controls input[type=range]{ width:160px; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="petal p1"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p2"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p3"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p4"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p5"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p6"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p7"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="petal p8"><img src="/__l5e/assets-v1/79ce7335-dda3-4d20-9c5b-fbcba1379367/petal.png" alt=""></div>
  <div class="circle"></div>
</div>

<div class="controls">
  <strong>Tune</strong>
  <label>Petal W <input type="range" min="80" max="280" value="170" id="pw"><span id="pwv">170</span></label>
  <label>Petal H <input type="range" min="80" max="320" value="230" id="ph"><span id="phv">230</span></label>
  <label>Offset  <input type="range" min="40" max="260" value="130" id="po"><span id="pov">130</span></label>
  <label>Circle  <input type="range" min="160" max="480" value="320" id="pc"><span id="pcv">320</span></label>
</div>

<script>
  const r = document.documentElement.style;
  const bind = (id, varName, suffix='px') => {
    const el = document.getElementById(id);
    const lbl = document.getElementById(id+'v');
    el.addEventListener('input', () => {
      r.setProperty(varName, el.value + suffix);
      lbl.textContent = el.value;
    });
  };
  bind('pw', '--petal-w');
  bind('ph', '--petal-h');
  bind('po', '--petal-offset');
  bind('pc', '--circle');
</script>

</body>
</html>
