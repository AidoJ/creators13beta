<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lotus Community Mockup</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0F172A; /* community page dark background so you can see the transparency */
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
  }

  :root {
    --lotus-size: 720px;
    --circle-d: 240px;        /* central gold circle diameter */
    --circle-color: #c8902a;  /* gold */
    --petal-w: 220px;         /* native petal width */
    --petal-h: 130px;         /* native petal height */
    --base-x: 0px;            /* petal base is the left edge of the image */
    --base-y: 65px;           /* vertical centre of the petal */
    --petal-offset: 120px;    /* distance from lotus centre to petal base */
  }

  .lotus {
    position: relative;
    width: var(--lotus-size);
    height: var(--lotus-size);
  }

  .petal {
    position: absolute;
    left: calc(50% + var(--petal-offset) * var(--dx) - var(--base-x));
    top: calc(50% + var(--petal-offset) * var(--dy) - var(--base-y));
    width: var(--petal-w);
    height: var(--petal-h);
    transform-origin: var(--base-x) var(--base-y);
    transform: rotate(var(--a));
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .petal img {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* right, up-right, up, up-left, left, down-left, down, down-right */
  .p1 { --a:   0deg; --dx:  1.000; --dy:  0.000; }
  .p2 { --a: -45deg; --dx:  0.707; --dy: -0.707; }
  .p3 { --a: -90deg; --dx:  0.000; --dy: -1.000; }
  .p4 { --a:-135deg; --dx: -0.707; --dy: -0.707; }
  .p5 { --a: 180deg; --dx: -1.000; --dy:  0.000; }
  .p6 { --a: 135deg; --dx: -0.707; --dy:  0.707; }
  .p7 { --a:  90deg; --dx:  0.000; --dy:  1.000; }
  .p8 { --a:  45deg; --dx:  0.707; --dy:  0.707; }

  .center-circle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--circle-d);
    height: var(--circle-d);
    margin-left: calc(var(--circle-d) / -2);
    margin-top: calc(var(--circle-d) / -2);
    border: 3px solid var(--circle-color);
    border-radius: 50%;
    background: transparent;
    z-index: 2;
  }

  /* Avatar placeholder sits in the centre of the circle */
  .avatar {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--circle-d) - 24px);
    height: calc(var(--circle-d) - 24px);
    margin-left: calc((var(--circle-d) - 24px) / -2);
    margin-top: calc((var(--circle-d) - 24px) / -2);
    border-radius: 50%;
    background: rgba(200, 144, 42, 0.15);
    border: 1px dashed rgba(200, 144, 42, 0.6);
    z-index: 3;
  }
</style>
</head>
<body>

<div class="lotus">
  <div class="petal p1"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p2"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p3"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p4"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p5"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p6"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p7"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="petal p8"><img src="/petal-outline-gold.png" alt="" /></div>
  <div class="center-circle"></div>
  <div class="avatar"></div>
</div>

</body>
</html>
