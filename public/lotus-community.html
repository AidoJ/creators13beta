<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lotus Community Mockup</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0F172A; overflow: hidden;
  }
  body { display: grid; place-items: center; }

  :root { --gold: #c8902a; }

  .lotus {
    width: min(720px, 92vmin);
    aspect-ratio: 1;
  }

  svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .line {
    fill: none;
    stroke: var(--gold);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .avatar-fill { fill: #26272b; }
  .avatar-guide {
    fill: none;
    stroke: rgba(200, 144, 42, 0.55);
    stroke-width: 1.2;
    stroke-dasharray: 2 4;
  }
</style>
</head>
<body>
<div class="lotus">
  <svg viewBox="0 0 720 720" role="img" aria-label="Lotus creator profile frame">
    <defs>
      <!-- One petal spans exactly 45 degrees: its two base points are the same
           points used by the neighbouring petals, so the petals connect around
           the centre instead of floating as separate PNGs. -->
      <path id="petal" d="M 298.8 212.2 C 286 178, 276 145, 287 119 C 299 94, 333 95, 360 72 C 387 95, 421 94, 433 119 C 444 145, 434 178, 421.2 212.2" />
    </defs>

    <g class="line">
      <use href="#petal" />
      <use href="#petal" transform="rotate(45 360 360)" />
      <use href="#petal" transform="rotate(90 360 360)" />
      <use href="#petal" transform="rotate(135 360 360)" />
      <use href="#petal" transform="rotate(180 360 360)" />
      <use href="#petal" transform="rotate(225 360 360)" />
      <use href="#petal" transform="rotate(270 360 360)" />
      <use href="#petal" transform="rotate(315 360 360)" />
      <circle cx="360" cy="360" r="164" />
    </g>

    <circle class="avatar-fill" cx="360" cy="360" r="138" />
    <circle class="avatar-guide" cx="360" cy="360" r="138" />
  </svg>
</div>
</body>
</html>
